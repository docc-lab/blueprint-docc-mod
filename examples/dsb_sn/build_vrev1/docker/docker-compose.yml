
version: '3'
services:

  composepost_service_vrev1_ctr:
    build:
      context: composepost_service_vrev1_ctr
      dockerfile: ./Dockerfile
    hostname: composepost_service_vrev1_ctr
    expose:
     - "12345"
    ports:
     - "${COMPOSEPOST_SERVICE_VREV1_GRPC_BIND_ADDR?composepost_service_vrev1.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - BRIDGE_KIND=v
     - COMPOSEPOST_SERVICE_VREV1_GRPC_BIND_ADDR=0.0.0.0:12345
     - GC_INTERVAL_SEC=0.1
     - GOGC=off
     - HOMETIMELINE_SERVICE_VREV1_GRPC_DIAL_ADDR=hometimeline_service_vrev1_ctr:12345
     - MEDIA_SERVICE_VREV1_GRPC_DIAL_ADDR=media_service_vrev1_ctr:12345
     - OTELCOL_VREV1_DIAL_ADDR=otelcol_vrev1_ctr:4317
     - POST_STORAGE_SERVICE_VREV1_GRPC_DIAL_ADDR=post_storage_service_vrev1_ctr:12345
     - SPAN_PADDING_BYTES=1024
     - TEXT_SERVICE_VREV1_GRPC_DIAL_ADDR=text_service_vrev1_ctr:12345
     - UNIQUEID_SERVICE_VREV1_GRPC_DIAL_ADDR=uniqueid_service_vrev1_ctr:12345
     - USERTIMELINE_SERVICE_VREV1_GRPC_DIAL_ADDR=usertimeline_service_vrev1_ctr:12345
     - USER_SERVICE_VREV1_GRPC_DIAL_ADDR=user_service_vrev1_ctr:12345
    restart: always

  hometimeline_cache_vrev1_ctr:
    image: redis:8.6
