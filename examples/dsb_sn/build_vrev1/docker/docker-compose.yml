    restart: always

  jaeger_vrev1_ctr:
    image: jaegertracing/all-in-one:latest
    hostname: jaeger_vrev1_ctr
    expose:
     - "4317"
     - "14268"
     - "16686"
    ports:
     - "${JAEGER_VREV1_BIND_ADDR?jaeger_vrev1.bind_addr must be set by the calling environment}:14268"
     - "${JAEGER_VREV1_OTLP_BIND_ADDR?jaeger_vrev1.otlp.bind_addr must be set by the calling environment}:4317"
     - "${JAEGER_VREV1_UI_BIND_ADDR?jaeger_vrev1.ui.bind_addr must be set by the calling environment}:16686"
    environment:
     - QUERY_MAX_CLOCK_SKEW_ADJUSTMENT=1m
    restart: always

