exporters:
    otlp:
        endpoint: ${JAEGER_SBREV0_OTLP_DIAL_ADDR}
        retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 0
            max_interval: 30s
        sending_queue:
            enabled: true
            block_on_overflow: false
            queue_size: 1000
        tls:
            insecure: true
    debug:
        verbosity: detailed
processors:
    batch: null
    memory_limiter:
        check_interval: 100ms
        limit_percentage: 70
        spike_limit_percentage: 20
receivers:
    configdiscovery:
        config_map:
            cpd: 3
        endpoint: :8080
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318
service:
    extensions: []
    pipelines:
        logs/configdiscovery:
            exporters:
                - debug
            processors: []
            receivers:
                - configdiscovery
        traces:
            exporters:
                - otlp
            processors:
                - memory_limiter
                - batch
            receivers:
                - otlp
    telemetry:
        logs:
            level: DEBUG
