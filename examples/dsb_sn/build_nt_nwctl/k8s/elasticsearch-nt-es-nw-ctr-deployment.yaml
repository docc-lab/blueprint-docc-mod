apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_nt_nwctl/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: elasticsearch-nt-es-nw-ctr
  name: elasticsearch-nt-es-nw-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: elasticsearch-nt-es-nw-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_nt_nwctl/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: elasticsearch-nt-es-nw-ctr
    spec:
      containers:
      - args:
        - elasticsearch
        - -Ediscovery.type=single-node
        - -Expack.security.enabled=false
        - -Ebootstrap.memory_lock=false
        env:
        - name: ES_JAVA_OPTS
          value: -Xms4g -Xmx4g
        - name: GOMAXPROCS
          value: '8'
        image: 10.10.1.1:30000/docker.elastic.co-elasticsearch-elasticsearch:7.17.20
        name: elasticsearch-nt-es-nw-ctr
        ports:
        - containerPort: 9200
          protocol: TCP
        resources:
          requests:
            cpu: 8000m
          limits:
            cpu: 8000m
      hostname: elasticsearch-nt-es-nw-ctr
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: node-9
