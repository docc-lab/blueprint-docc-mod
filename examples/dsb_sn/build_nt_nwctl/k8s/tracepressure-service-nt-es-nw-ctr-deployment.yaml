apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_nt_nwctl/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: tracepressure-service-nt-es-nw-ctr
  name: tracepressure-service-nt-es-nw-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: tracepressure-service-nt-es-nw-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_nt_nwctl/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: tracepressure-service-nt-es-nw-ctr
    spec:
      containers:
      - env:
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: TRACEPRESSURE_SERVICE_NT_ES_NW_HTTP_BIND_ADDR
          value: 0.0.0.0:2000
        - name: OTLP_RETRY
          value: 'off'
        image: 10.10.1.1:30000/tracepressure-service-nt-es-nw-ctr:latest
        name: tracepressure-service-nt-es-nw-ctr
        ports:
        - containerPort: 2000
          protocol: TCP
      hostname: tracepressure-service-nt-es-nw-ctr
      restartPolicy: Always
