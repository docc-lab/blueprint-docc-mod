apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_cgpb_ctl/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: wrk2api-service-cgpb-es-ctr
  name: wrk2api-service-cgpb-es-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: wrk2api-service-cgpb-es-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_cgpb_ctl/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: wrk2api-service-cgpb-es-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: cgpb
        - name: COMPOSEPOST_SERVICE_CGPB_ES_GRPC_DIAL_ADDR
          value: composepost-service-cgpb-es-ctr:12345
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: HOMETIMELINE_SERVICE_CGPB_ES_GRPC_DIAL_ADDR
          value: hometimeline-service-cgpb-es-ctr:12345
        - name: OTELCOL_CGPB_ES_DIAL_ADDR
          value: otelcol-cgpb-es-ctr:4317
        - name: SOCIALGRAPH_SERVICE_CGPB_ES_GRPC_DIAL_ADDR
          value: socialgraph-service-cgpb-es-ctr:12345
        - name: USERTIMELINE_SERVICE_CGPB_ES_GRPC_DIAL_ADDR
          value: usertimeline-service-cgpb-es-ctr:12345
        - name: USER_SERVICE_CGPB_ES_GRPC_DIAL_ADDR
          value: user-service-cgpb-es-ctr:12345
        - name: WRK2API_SERVICE_CGPB_ES_HTTP_BIND_ADDR
          value: 0.0.0.0:2000
        - name: OTLP_RETRY
          value: 'off'
        - name: GOMAXPROCS
          value: '8'
        image: 10.10.1.1:30000/wrk2api-service-cgpb-es-ctr:latest
        name: wrk2api-service-cgpb-es-ctr
        ports:
        - containerPort: 2000
          protocol: TCP
        resources:
          requests:
            cpu: 8000m
          limits:
            cpu: 8000m
      hostname: wrk2api-service-cgpb-es-ctr
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: node-7
