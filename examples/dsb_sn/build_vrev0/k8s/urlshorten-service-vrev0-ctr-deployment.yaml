          value: urlshorten-db-vrev0-ctr:27017
        - name: URLSHORTEN_SERVICE_VREV0_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        image: 10.10.1.1:30000/urlshorten-service-vrev0-ctr:latest
        name: urlshorten-service-vrev0-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
      hostname: urlshorten-service-vrev0-ctr
      restartPolicy: Always
