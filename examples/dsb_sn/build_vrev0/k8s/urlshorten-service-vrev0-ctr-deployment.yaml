apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/wiring/build_v_rev0/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: urlshorten-service-vrev0-ctr
  name: urlshorten-service-vrev0-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: urlshorten-service-vrev0-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/wiring/build_v_rev0/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: urlshorten-service-vrev0-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: v
        - name: GC_INTERVAL_SEC
          value: '0.1'
        - name: GOGC
          value: 'off'
        - name: OTELCOL_VREV0_DIAL_ADDR
          value: otelcol-vrev0-ctr:4317
