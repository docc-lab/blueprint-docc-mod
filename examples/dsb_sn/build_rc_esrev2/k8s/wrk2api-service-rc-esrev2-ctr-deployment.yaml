apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_rc_esrev2/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: wrk2api-service-rc-esrev2-ctr
  name: wrk2api-service-rc-esrev2-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: wrk2api-service-rc-esrev2-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_rc_esrev2/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: wrk2api-service-rc-esrev2-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: rc
        - name: COMPOSEPOST_SERVICE_RC_ESREV2_GRPC_DIAL_ADDR
          value: composepost-service-rc-esrev2-ctr:12345
        - name: GC_INTERVAL_SEC
          value: '0.1'
        - name: GOGC
          value: 'off'
        - name: HOMETIMELINE_SERVICE_RC_ESREV2_GRPC_DIAL_ADDR
          value: hometimeline-service-rc-esrev2-ctr:12345
        - name: OTELCOL_RC_ESREV2_DIAL_ADDR
          value: otelcol-rc-esrev2-ctr:4317
        - name: OTLP_RETRY
          value: 'off'
        - name: SOCIALGRAPH_SERVICE_RC_ESREV2_GRPC_DIAL_ADDR
          value: socialgraph-service-rc-esrev2-ctr:12345
        - name: USERTIMELINE_SERVICE_RC_ESREV2_GRPC_DIAL_ADDR
          value: usertimeline-service-rc-esrev2-ctr:12345
        - name: USER_SERVICE_RC_ESREV2_GRPC_DIAL_ADDR
          value: user-service-rc-esrev2-ctr:12345
        - name: WRK2API_SERVICE_RC_ESREV2_HTTP_BIND_ADDR
          value: 0.0.0.0:2000
        - name: RC_BR_BASE
          value: '20'
        - name: RC_BR_SLOPE
          value: '4'
        image: 10.10.1.1:30000/wrk2api-service-rc-esrev2-ctr:latest
        name: wrk2api-service-rc-esrev2-ctr
        ports:
        - containerPort: 2000
          protocol: TCP
      hostname: wrk2api-service-rc-esrev2-ctr
      restartPolicy: Always
