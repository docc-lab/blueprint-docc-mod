apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_rc_esrev2/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: post-storage-service-rc-esrev2-ctr
  name: post-storage-service-rc-esrev2-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: post-storage-service-rc-esrev2-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_rc_esrev2/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: post-storage-service-rc-esrev2-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: rc
        - name: GC_INTERVAL_SEC
          value: '0.1'
        - name: GOGC
          value: 'off'
        - name: OTELCOL_RC_ESREV2_DIAL_ADDR
          value: otelcol-rc-esrev2-ctr:4317
        - name: OTLP_RETRY
          value: 'off'
        - name: POST_CACHE_RC_ESREV2_DIAL_ADDR
          value: post-cache-rc-esrev2-ctr:6379
        - name: POST_DB_RC_ESREV2_DIAL_ADDR
          value: post-db-rc-esrev2-ctr:27017
        - name: POST_STORAGE_SERVICE_RC_ESREV2_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: RC_BR_BASE
          value: '20'
        - name: RC_BR_SLOPE
          value: '4'
        image: 10.10.1.1:30000/post-storage-service-rc-esrev2-ctr:latest
        name: post-storage-service-rc-esrev2-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
        resources:
          requests:
            cpu: 5000m
      hostname: post-storage-service-rc-esrev2-ctr
      nodeSelector:
        kubernetes.io/hostname: node-6
      restartPolicy: Always
