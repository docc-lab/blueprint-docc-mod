apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_v_aatest/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: hometimeline-service-v-es-ctr
  name: hometimeline-service-v-es-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: hometimeline-service-v-es-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_v_aatest/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: hometimeline-service-v-es-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: v
        - name: GC_INTERVAL_SEC
          value: '0.1'
        - name: GOGC
          value: 'off'
        - name: HOMETIMELINE_CACHE_V_ES_DIAL_ADDR
          value: hometimeline-cache-v-es-ctr:6379
        - name: HOMETIMELINE_SERVICE_V_ES_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: OTELCOL_V_ES_DIAL_ADDR
          value: otelcol-v-es-ctr:4317
        - name: POST_STORAGE_SERVICE_V_ES_GRPC_DIAL_ADDR
          value: post-storage-service-v-es-ctr:12345
        - name: SOCIALGRAPH_SERVICE_V_ES_GRPC_DIAL_ADDR
          value: socialgraph-service-v-es-ctr:12345
        image: 10.10.1.1:30000/hometimeline-service-v-es-ctr:latest
        name: hometimeline-service-v-es-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
      hostname: hometimeline-service-v-es-ctr
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: node-2
