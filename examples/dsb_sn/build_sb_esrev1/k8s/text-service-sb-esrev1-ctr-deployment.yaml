apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_sb_esrev1/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: text-service-sb-esrev1-ctr
  name: text-service-sb-esrev1-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: text-service-sb-esrev1-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_sb_esrev1/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: text-service-sb-esrev1-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: sb
        - name: GC_INTERVAL_SEC
          value: '0.1'
        - name: GOGC
          value: 'off'
        - name: OTELCOL_SB_ESREV1_DIAL_ADDR
          value: otelcol-sb-esrev1-ctr:4317
        - name: OTLP_RETRY
          value: 'off'
        - name: TEXT_SERVICE_SB_ESREV1_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: URLSHORTEN_SERVICE_SB_ESREV1_GRPC_DIAL_ADDR
          value: urlshorten-service-sb-esrev1-ctr:12345
        - name: USERMENTION_SERVICE_SB_ESREV1_GRPC_DIAL_ADDR
          value: usermention-service-sb-esrev1-ctr:12345
        image: 10.10.1.1:30000/text-service-sb-esrev1-ctr:latest
        name: text-service-sb-esrev1-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
        resources:
