apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_sb_nwctl/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: user-service-sb-es-nw-ctr
  name: user-service-sb-es-nw-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-service-sb-es-nw-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_sb_nwctl/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: user-service-sb-es-nw-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: sb
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: OTELCOL_SB_ES_NW_DIAL_ADDR
          value: otelcol-sb-es-nw-ctr:4317
        - name: SOCIALGRAPH_SERVICE_SB_ES_NW_GRPC_DIAL_ADDR
          value: socialgraph-service-sb-es-nw-ctr:12345
        - name: USER_CACHE_SB_ES_NW_DIAL_ADDR
          value: user-cache-sb-es-nw-ctr:6379
        - name: USER_DB_SB_ES_NW_DIAL_ADDR
          value: user-db-sb-es-nw-ctr:27017
        - name: USER_SERVICE_SB_ES_NW_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: OTLP_RETRY
          value: 'off'
        - name: OTEL_SAMPLE_RATIO
          value: '0.1'
        - name: GOMAXPROCS
          value: '8'
        image: 10.10.1.1:30000/user-service-sb-es-nw-ctr:latest
        name: user-service-sb-es-nw-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
        resources:
          requests:
            cpu: 8000m
          limits:
            cpu: 8000m
      hostname: user-service-sb-es-nw-ctr
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: node-8
