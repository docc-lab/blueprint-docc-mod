apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_v_nwctl/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: wrk2api-service-v-es-nw-ctr
  name: wrk2api-service-v-es-nw-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: wrk2api-service-v-es-nw-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_v_nwctl/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: wrk2api-service-v-es-nw-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: v
        - name: COMPOSEPOST_SERVICE_V_ES_NW_GRPC_DIAL_ADDR
          value: composepost-service-v-es-nw-ctr:12345
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: HOMETIMELINE_SERVICE_V_ES_NW_GRPC_DIAL_ADDR
          value: hometimeline-service-v-es-nw-ctr:12345
        - name: OTELCOL_V_ES_NW_DIAL_ADDR
          value: otelcol-v-es-nw-ctr:4317
        - name: SOCIALGRAPH_SERVICE_V_ES_NW_GRPC_DIAL_ADDR
          value: socialgraph-service-v-es-nw-ctr:12345
        - name: USERTIMELINE_SERVICE_V_ES_NW_GRPC_DIAL_ADDR
          value: usertimeline-service-v-es-nw-ctr:12345
        - name: USER_SERVICE_V_ES_NW_GRPC_DIAL_ADDR
          value: user-service-v-es-nw-ctr:12345
        - name: WRK2API_SERVICE_V_ES_NW_HTTP_BIND_ADDR
          value: 0.0.0.0:2000
        - name: OTLP_RETRY
          value: 'off'
        - name: OTEL_SAMPLE_RATIO
          value: '0.1'
        - name: GOMAXPROCS
          value: '8'
        image: 10.10.1.1:30000/wrk2api-service-v-es-nw-ctr:latest
        name: wrk2api-service-v-es-nw-ctr
        ports:
        - containerPort: 2000
          protocol: TCP
        resources:
          requests:
            cpu: 8000m
          limits:
            cpu: 8000m
      hostname: wrk2api-service-v-es-nw-ctr
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: node-7
