apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_pb_estest2/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: userid-service-pb-estest2-ctr
  name: userid-service-pb-estest2-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: userid-service-pb-estest2-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_pb_estest2/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: userid-service-pb-estest2-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: pb
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: OTELCOL_PB_ESTEST2_DIAL_ADDR
          value: otelcol-pb-estest2-ctr:4317
        - name: USERID_SERVICE_PB_ESTEST2_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: USER_CACHE_PB_ESTEST2_DIAL_ADDR
          value: user-cache-pb-estest2-ctr:6379
        - name: USER_DB_PB_ESTEST2_DIAL_ADDR
          value: user-db-pb-estest2-ctr:27017
        image: 10.10.1.1:30000/userid-service-pb-estest2-ctr:latest
        name: userid-service-pb-estest2-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
        resources:
