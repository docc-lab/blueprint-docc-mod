apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_cgpb_es_nw/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: media-service-cgpb-es-nw-ctr
  name: media-service-cgpb-es-nw-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: media-service-cgpb-es-nw-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_cgpb_es_nw/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: media-service-cgpb-es-nw-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: cgpb
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: MEDIA_SERVICE_CGPB_ES_NW_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: OTELCOL_CGPB_ES_NW_DIAL_ADDR
          value: otelcol-cgpb-es-nw-ctr:4317
        image: 10.10.1.1:30000/media-service-cgpb-es-nw-ctr:latest
        name: media-service-cgpb-es-nw-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
      hostname: media-service-cgpb-es-nw-ctr
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: node-6
