apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_pb_esrev2/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: user-service-pb-esrev2-ctr
  name: user-service-pb-esrev2-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-service-pb-esrev2-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_pb_esrev2/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: user-service-pb-esrev2-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: pb
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: OTELCOL_PB_ESREV2_DIAL_ADDR
          value: otelcol-pb-esrev2-ctr:4317
        - name: OTLP_RETRY
          value: 'off'
        - name: SOCIALGRAPH_SERVICE_PB_ESREV2_GRPC_DIAL_ADDR
          value: socialgraph-service-pb-esrev2-ctr:12345
        - name: USER_CACHE_PB_ESREV2_DIAL_ADDR
          value: user-cache-pb-esrev2-ctr:6379
        - name: USER_DB_PB_ESREV2_DIAL_ADDR
          value: user-db-pb-esrev2-ctr:27017
        - name: USER_SERVICE_PB_ESREV2_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: GODEBUG
          value: gctrace=1
        image: 10.10.1.1:30000/user-service-pb-esrev2-ctr:latest
        name: user-service-pb-esrev2-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
        resources:
          requests:
            cpu: 3000m
      hostname: user-service-pb-esrev2-ctr
      nodeSelector:
        kubernetes.io/hostname: node-8
      restartPolicy: Always
