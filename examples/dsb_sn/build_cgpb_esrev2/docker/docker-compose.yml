
version: '3'
services:

  composepost_service_cgpb_esrev2_ctr:
    build:
      context: composepost_service_cgpb_esrev2_ctr
      dockerfile: ./Dockerfile
    hostname: composepost_service_cgpb_esrev2_ctr
    expose:
     - "12345"
    ports:
     - "${COMPOSEPOST_SERVICE_CGPB_ESREV2_GRPC_BIND_ADDR?composepost_service_cgpb_esrev2.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - BRIDGE_KIND=cgpb
     - COMPOSEPOST_SERVICE_CGPB_ESREV2_GRPC_BIND_ADDR=0.0.0.0:12345
     - GC_INTERVAL_SEC=0.1
     - GOGC=off
     - HOMETIMELINE_SERVICE_CGPB_ESREV2_GRPC_DIAL_ADDR=hometimeline_service_cgpb_esrev2_ctr:12345
     - MEDIA_SERVICE_CGPB_ESREV2_GRPC_DIAL_ADDR=media_service_cgpb_esrev2_ctr:12345
     - OTELCOL_CGPB_ESREV2_DIAL_ADDR=otelcol_cgpb_esrev2_ctr:4317
     - POST_STORAGE_SERVICE_CGPB_ESREV2_GRPC_DIAL_ADDR=post_storage_service_cgpb_esrev2_ctr:12345
     - TEXT_SERVICE_CGPB_ESREV2_GRPC_DIAL_ADDR=text_service_cgpb_esrev2_ctr:12345
     - UNIQUEID_SERVICE_CGPB_ESREV2_GRPC_DIAL_ADDR=uniqueid_service_cgpb_esrev2_ctr:12345
     - USERTIMELINE_SERVICE_CGPB_ESREV2_GRPC_DIAL_ADDR=usertimeline_service_cgpb_esrev2_ctr:12345
     - USER_SERVICE_CGPB_ESREV2_GRPC_DIAL_ADDR=user_service_cgpb_esrev2_ctr:12345
    restart: always

  elasticsearch_cgpb_esrev2_ctr:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.20
    hostname: elasticsearch_cgpb_esrev2_ctr
    expose:
     - "9200"
    ports:
     - "${ELASTICSEARCH_CGPB_ESREV2_BIND_ADDR?elasticsearch_cgpb_esrev2.bind_addr must be set by the calling environment}:9200"
    environment:
     - ES_JAVA_OPTS=-Xms4g -Xmx4g
    command:
     - "elasticsearch"
     - "-Ediscovery.type=single-node"
     - "-Expack.security.enabled=false"
     - "-Ebootstrap.memory_lock=false"
    restart: always

  hometimeline_cache_cgpb_esrev2_ctr:
