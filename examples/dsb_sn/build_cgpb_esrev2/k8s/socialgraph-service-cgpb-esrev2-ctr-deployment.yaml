apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_cgpb_esrev2/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: socialgraph-service-cgpb-esrev2-ctr
  name: socialgraph-service-cgpb-esrev2-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: socialgraph-service-cgpb-esrev2-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_cgpb_esrev2/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: socialgraph-service-cgpb-esrev2-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: cgpb
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: OTELCOL_CGPB_ESREV2_DIAL_ADDR
          value: otelcol-cgpb-esrev2-ctr:4317
        - name: OTLP_RETRY
          value: 'off'
        - name: SOCIALGRAPH_SERVICE_CGPB_ESREV2_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: SOCIAL_CACHE_CGPB_ESREV2_DIAL_ADDR
          value: social-cache-cgpb-esrev2-ctr:6379
        - name: SOCIAL_DB_CGPB_ESREV2_DIAL_ADDR
          value: social-db-cgpb-esrev2-ctr:27017
        - name: USERID_SERVICE_CGPB_ESREV2_GRPC_DIAL_ADDR
          value: userid-service-cgpb-esrev2-ctr:12345
        image: 10.10.1.1:30000/socialgraph-service-cgpb-esrev2-ctr:latest
        name: socialgraph-service-cgpb-esrev2-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
        resources:
          requests:
            cpu: 6000m
      hostname: socialgraph-service-cgpb-esrev2-ctr
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: node-2
