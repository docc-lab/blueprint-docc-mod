apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_pb_estest/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: post-storage-service-pb-estest-ctr
  name: post-storage-service-pb-estest-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: post-storage-service-pb-estest-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_pb_estest/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: post-storage-service-pb-estest-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: pb
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: OTELCOL_PB_ESTEST_DIAL_ADDR
          value: otelcol-pb-estest-ctr:4317
        - name: POST_CACHE_PB_ESTEST_DIAL_ADDR
          value: post-cache-pb-estest-ctr:6379
        - name: POST_DB_PB_ESTEST_DIAL_ADDR
          value: post-db-pb-estest-ctr:27017
        - name: POST_STORAGE_SERVICE_PB_ESTEST_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        image: 10.10.1.1:30000/post-storage-service-pb-estest-ctr:latest
        name: post-storage-service-pb-estest-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
      hostname: post-storage-service-pb-estest-ctr
      restartPolicy: Always
