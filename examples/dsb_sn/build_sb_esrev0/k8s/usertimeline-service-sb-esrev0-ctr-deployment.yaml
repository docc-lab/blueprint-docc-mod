apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_sb_esrev0/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: usertimeline-service-sb-esrev0-ctr
  name: usertimeline-service-sb-esrev0-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: usertimeline-service-sb-esrev0-ctr
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_sb_esrev0/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: usertimeline-service-sb-esrev0-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: sb
        - name: GC_INTERVAL_SEC
          value: '0.1'
        - name: GOGC
          value: 'off'
        - name: OTELCOL_SB_ESREV0_DIAL_ADDR
          value: otelcol-sb-esrev0-ctr:4317
        - name: OTLP_DEADLINE_MS
          value: '1000'
        - name: OTLP_RETRY
          value: 'off'
        - name: POST_STORAGE_SERVICE_SB_ESREV0_GRPC_DIAL_ADDR
          value: post-storage-service-sb-esrev0-ctr:12345
        - name: SPAN_PADDING_BYTES
          value: '0'
        - name: USERTIMELINE_CACHE_SB_ESREV0_DIAL_ADDR
          value: usertimeline-cache-sb-esrev0-ctr:6379
        - name: USERTIMELINE_DB_SB_ESREV0_DIAL_ADDR
          value: usertimeline-db-sb-esrev0-ctr:27017
        - name: USERTIMELINE_SERVICE_SB_ESREV0_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        image: 10.10.1.1:30000/usertimeline-service-sb-esrev0-ctr:latest
        name: usertimeline-service-sb-esrev0-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
        resources:
          requests:
            cpu: 8000m
      hostname: usertimeline-service-sb-esrev0-ctr
      nodeSelector:
        kubernetes.io/hostname: node-4
      restartPolicy: Always
