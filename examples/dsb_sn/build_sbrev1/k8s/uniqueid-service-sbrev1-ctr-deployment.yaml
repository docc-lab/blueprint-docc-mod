apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_sbrev1/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: uniqueid-service-sbrev1-ctr
  name: uniqueid-service-sbrev1-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: uniqueid-service-sbrev1-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_sbrev1/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: uniqueid-service-sbrev1-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: sb
        - name: GC_INTERVAL_SEC
          value: '0.1'
        - name: GOGC
          value: 'off'
        - name: OTELCOL_SBREV1_DIAL_ADDR
          value: otelcol-sbrev1-ctr:4317
        - name: SPAN_PADDING_BYTES
          value: '1024'
        - name: UNIQUEID_SERVICE_SBREV1_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        image: 10.10.1.1:30000/uniqueid-service-sbrev1-ctr:latest
        name: uniqueid-service-sbrev1-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
      hostname: uniqueid-service-sbrev1-ctr
      restartPolicy: Always
