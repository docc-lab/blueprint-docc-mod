apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_nt_ctl/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: composepost-service-nt-es-ctr
  name: composepost-service-nt-es-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: composepost-service-nt-es-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_nt_ctl/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: composepost-service-nt-es-ctr
    spec:
      containers:
      - env:
        - name: COMPOSEPOST_SERVICE_NT_ES_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: HOMETIMELINE_SERVICE_NT_ES_GRPC_DIAL_ADDR
          value: hometimeline-service-nt-es-ctr:12345
        - name: MEDIA_SERVICE_NT_ES_GRPC_DIAL_ADDR
          value: media-service-nt-es-ctr:12345
        - name: POST_STORAGE_SERVICE_NT_ES_GRPC_DIAL_ADDR
          value: post-storage-service-nt-es-ctr:12345
        - name: TEXT_SERVICE_NT_ES_GRPC_DIAL_ADDR
          value: text-service-nt-es-ctr:12345
        - name: UNIQUEID_SERVICE_NT_ES_GRPC_DIAL_ADDR
          value: uniqueid-service-nt-es-ctr:12345
        - name: USERTIMELINE_SERVICE_NT_ES_GRPC_DIAL_ADDR
          value: usertimeline-service-nt-es-ctr:12345
        - name: USER_SERVICE_NT_ES_GRPC_DIAL_ADDR
          value: user-service-nt-es-ctr:12345
        - name: OTLP_RETRY
          value: 'off'
        - name: GOMAXPROCS
          value: '8'
        image: 10.10.1.1:30000/composepost-service-nt-es-ctr:latest
        name: composepost-service-nt-es-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
        resources:
          requests:
            cpu: 8000m
          limits:
            cpu: 8000m
      hostname: composepost-service-nt-es-ctr
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: node-1
