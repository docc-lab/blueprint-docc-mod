apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_nt_ctl/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: usermention-service-nt-es-ctr
  name: usermention-service-nt-es-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: usermention-service-nt-es-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_nt_ctl/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: usermention-service-nt-es-ctr
    spec:
      containers:
      - env:
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: USERMENTION_SERVICE_NT_ES_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: USER_CACHE_NT_ES_DIAL_ADDR
          value: user-cache-nt-es-ctr:6379
        - name: USER_DB_NT_ES_DIAL_ADDR
          value: user-db-nt-es-ctr:27017
        - name: OTLP_RETRY
          value: 'off'
        - name: GOMAXPROCS
          value: '8'
        image: 10.10.1.1:30000/usermention-service-nt-es-ctr:latest
        name: usermention-service-nt-es-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
        resources:
          requests:
            cpu: 8000m
          limits:
            cpu: 8000m
      hostname: usermention-service-nt-es-ctr
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: node-3
