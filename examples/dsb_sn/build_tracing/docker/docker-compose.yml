
version: '3'
services:

  compose_container:
    build:
      context: compose_container
      dockerfile: ./Dockerfile
    hostname: compose_container
    expose:
     - "12345"
    ports:
     - "${COMPOSEPOST_SERVICE_GRPC_BIND_ADDR?composepost_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - COMPOSEPOST_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
     - HOMETIMELINE_SERVICE_GRPC_DIAL_ADDR=hometimeline_container:12345
     - MEDIA_SERVICE_GRPC_DIAL_ADDR=media_container:12345
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - POST_STORAGE_SERVICE_GRPC_DIAL_ADDR=post_storage_container:12345
     - TEXT_SERVICE_GRPC_DIAL_ADDR=text_container:12345
     - UNIQUEID_SERVICE_GRPC_DIAL_ADDR=uniqueid_container:12345
     - USERTIMELINE_SERVICE_GRPC_DIAL_ADDR=usertimeline_container:12345
     - USER_SERVICE_GRPC_DIAL_ADDR=user_container:12345
    restart: always

  hometimeline_cache_ctr:
    image: memcached
    hostname: hometimeline_cache_ctr
    expose:
     - "11211"
    ports:
     - "${HOMETIMELINE_CACHE_BIND_ADDR?hometimeline_cache.bind_addr must be set by the calling environment}:11211"
    restart: always

  hometimeline_container:
    build:
      context: hometimeline_container
      dockerfile: ./Dockerfile
    hostname: hometimeline_container
    expose:
     - "12345"
    ports:
     - "${HOMETIMELINE_SERVICE_GRPC_BIND_ADDR?hometimeline_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - HOMETIMELINE_CACHE_DIAL_ADDR=hometimeline_cache_ctr:11211
     - HOMETIMELINE_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - POST_STORAGE_SERVICE_GRPC_DIAL_ADDR=post_storage_container:12345
     - SOCIALGRAPH_SERVICE_GRPC_DIAL_ADDR=socialgraph_container:12345
    restart: always

  media_container:
    build:
      context: media_container
      dockerfile: ./Dockerfile
    hostname: media_container
    expose:
     - "12345"
    ports:
     - "${MEDIA_SERVICE_GRPC_BIND_ADDR?media_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - MEDIA_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
    restart: always

  otel_collector_ctr:
    image: otel/opentelemetry-collector-contrib:0.160.0
    hostname: otel_collector_ctr
    expose:
     - "4317"
    ports:
     - "${OTEL_COLLECTOR_BIND_ADDR?otel_collector.bind_addr must be set by the calling environment}:4317"
    restart: always

  post_cache_ctr:
    image: memcached
    hostname: post_cache_ctr
    expose:
     - "11211"
    ports:
     - "${POST_CACHE_BIND_ADDR?post_cache.bind_addr must be set by the calling environment}:11211"
    restart: always

  post_db_ctr:
    image: mongo
    hostname: post_db_ctr
    expose:
     - "27017"
    ports:
     - "${POST_DB_BIND_ADDR?post_db.bind_addr must be set by the calling environment}:27017"
    restart: always

  post_storage_container:
    build:
      context: post_storage_container
      dockerfile: ./Dockerfile
    hostname: post_storage_container
    expose:
     - "12345"
    ports:
     - "${POST_STORAGE_SERVICE_GRPC_BIND_ADDR?post_storage_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - POST_CACHE_DIAL_ADDR=post_cache_ctr:11211
     - POST_DB_DIAL_ADDR=post_db_ctr:27017
     - POST_STORAGE_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
    restart: always

  social_cache_ctr:
    image: memcached
    hostname: social_cache_ctr
    expose:
     - "11211"
    ports:
     - "${SOCIAL_CACHE_BIND_ADDR?social_cache.bind_addr must be set by the calling environment}:11211"
    restart: always

  social_db_ctr:
    image: mongo
    hostname: social_db_ctr
    expose:
     - "27017"
    ports:
     - "${SOCIAL_DB_BIND_ADDR?social_db.bind_addr must be set by the calling environment}:27017"
    restart: always

  socialgraph_container:
    build:
      context: socialgraph_container
      dockerfile: ./Dockerfile
    hostname: socialgraph_container
    expose:
     - "12345"
    ports:
     - "${SOCIALGRAPH_SERVICE_GRPC_BIND_ADDR?socialgraph_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - SOCIALGRAPH_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
     - SOCIAL_CACHE_DIAL_ADDR=social_cache_ctr:11211
     - SOCIAL_DB_DIAL_ADDR=social_db_ctr:27017
     - USERID_SERVICE_GRPC_DIAL_ADDR=userid_container:12345
    restart: always

  text_container:
    build:
      context: text_container
      dockerfile: ./Dockerfile
    hostname: text_container
    expose:
     - "12345"
    ports:
     - "${TEXT_SERVICE_GRPC_BIND_ADDR?text_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - TEXT_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
     - URLSHORTEN_SERVICE_GRPC_DIAL_ADDR=urlshorten_container:12345
     - USERMENTION_SERVICE_GRPC_DIAL_ADDR=usermention_container:12345
    restart: always

  uniqueid_container:
    build:
      context: uniqueid_container
      dockerfile: ./Dockerfile
    hostname: uniqueid_container
    expose:
     - "12345"
    ports:
     - "${UNIQUEID_SERVICE_GRPC_BIND_ADDR?uniqueid_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - UNIQUEID_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
    restart: always

  urlshorten_container:
    build:
      context: urlshorten_container
      dockerfile: ./Dockerfile
    hostname: urlshorten_container
    expose:
     - "12345"
    ports:
     - "${URLSHORTEN_SERVICE_GRPC_BIND_ADDR?urlshorten_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - URLSHORTEN_DB_DIAL_ADDR=urlshorten_db_ctr:27017
     - URLSHORTEN_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
    restart: always

  urlshorten_db_ctr:
    image: mongo
    hostname: urlshorten_db_ctr
    expose:
     - "27017"
    ports:
     - "${URLSHORTEN_DB_BIND_ADDR?urlshorten_db.bind_addr must be set by the calling environment}:27017"
    restart: always

  user_cache_ctr:
    image: memcached
    hostname: user_cache_ctr
    expose:
     - "11211"
    ports:
     - "${USER_CACHE_BIND_ADDR?user_cache.bind_addr must be set by the calling environment}:11211"
    restart: always

  user_container:
    build:
      context: user_container
      dockerfile: ./Dockerfile
    hostname: user_container
    expose:
     - "12345"
    ports:
     - "${USER_SERVICE_GRPC_BIND_ADDR?user_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - SOCIALGRAPH_SERVICE_GRPC_DIAL_ADDR=socialgraph_container:12345
     - USER_CACHE_DIAL_ADDR=user_cache_ctr:11211
     - USER_DB_DIAL_ADDR=user_db_ctr:27017
     - USER_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
    restart: always

  user_db_ctr:
    image: mongo
    hostname: user_db_ctr
    expose:
     - "27017"
    ports:
     - "${USER_DB_BIND_ADDR?user_db.bind_addr must be set by the calling environment}:27017"
    restart: always

  userid_container:
    build:
      context: userid_container
      dockerfile: ./Dockerfile
    hostname: userid_container
    expose:
     - "12345"
    ports:
     - "${USERID_SERVICE_GRPC_BIND_ADDR?userid_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - USERID_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
     - USER_CACHE_DIAL_ADDR=user_cache_ctr:11211
     - USER_DB_DIAL_ADDR=user_db_ctr:27017
    restart: always

  usermention_container:
    build:
      context: usermention_container
      dockerfile: ./Dockerfile
    hostname: usermention_container
    expose:
     - "12345"
    ports:
     - "${USERMENTION_SERVICE_GRPC_BIND_ADDR?usermention_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - USERMENTION_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
     - USER_CACHE_DIAL_ADDR=user_cache_ctr:11211
     - USER_DB_DIAL_ADDR=user_db_ctr:27017
    restart: always

  usertimeline_cache_ctr:
    image: memcached
    hostname: usertimeline_cache_ctr
    expose:
     - "11211"
    ports:
     - "${USERTIMELINE_CACHE_BIND_ADDR?usertimeline_cache.bind_addr must be set by the calling environment}:11211"
    restart: always

  usertimeline_container:
    build:
      context: usertimeline_container
      dockerfile: ./Dockerfile
    hostname: usertimeline_container
    expose:
     - "12345"
    ports:
     - "${USERTIMELINE_SERVICE_GRPC_BIND_ADDR?usertimeline_service.grpc.bind_addr must be set by the calling environment}:12345"
    environment:
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - POST_STORAGE_SERVICE_GRPC_DIAL_ADDR=post_storage_container:12345
     - USERTIMELINE_CACHE_DIAL_ADDR=usertimeline_cache_ctr:11211
     - USERTIMELINE_DB_DIAL_ADDR=usertimeline_db_ctr:27017
     - USERTIMELINE_SERVICE_GRPC_BIND_ADDR=0.0.0.0:12345
    restart: always

  usertimeline_db_ctr:
    image: mongo
    hostname: usertimeline_db_ctr
    expose:
     - "27017"
    ports:
     - "${USERTIMELINE_DB_BIND_ADDR?usertimeline_db.bind_addr must be set by the calling environment}:27017"
    restart: always

  wrk2api_container:
    build:
      context: wrk2api_container
      dockerfile: ./Dockerfile
    hostname: wrk2api_container
    expose:
     - "2000"
    ports:
     - "${WRK2API_SERVICE_HTTP_BIND_ADDR?wrk2api_service.http.bind_addr must be set by the calling environment}:2000"
    environment:
     - COMPOSEPOST_SERVICE_GRPC_DIAL_ADDR=compose_container:12345
     - HOMETIMELINE_SERVICE_GRPC_DIAL_ADDR=hometimeline_container:12345
     - OTEL_COLLECTOR_DIAL_ADDR=otel_collector_ctr:4317
     - SOCIALGRAPH_SERVICE_GRPC_DIAL_ADDR=socialgraph_container:12345
     - USERTIMELINE_SERVICE_GRPC_DIAL_ADDR=usertimeline_container:12345
     - USER_SERVICE_GRPC_DIAL_ADDR=user_container:12345
     - WRK2API_SERVICE_HTTP_BIND_ADDR=0.0.0.0:2000
    restart: always

