# =============================================================================
# DeathStarBench Social Network (Blueprint), GRPC between services,
# WITH tracing (spans to otel-central:4317), all pods on dell66
#
# Generated by gen_app_manifest.py from Blueprint's build/docker/docker-compose.yml.
# Requires dsb-sn-rapl.yaml to be applied first (creates the namespace and the
# anyuid permission that mongo/memcached need).
#
#   - application images: docker.io/maxlanliu/dsbsn-<service>:tracing, imagePullPolicy: Always
#     Built from patched Blueprint code (see the FIX comments in the source):
#       * gRPC between services instead of Thrift (Blueprint's Thrift client
#         is not safe for concurrent requests)
#       * UserTimelineService: cache stores []PostInfo, not []int64 (FIX 1-3)
#       * UniqueIdService: locked counter, custom epoch, wider counter
#       * UserTimelineService: per-user lock in WriteUserTimeline (FIX 4)
#       * HomeTimelineService: per-follower lock in WriteHomeTimeline (FIX 5)
#       * Home and user timelines capped at the newest 100 entries (FIX 6),
#         so the cost of a post does not grow with every earlier post
#       * HomeTimelineService: all followers' timelines updated in parallel
#         (FIX 7), so a post waits for the slowest update, not their sum
#     FIX 4 and FIX 5 assume ONE replica of those services (as deployed here).
#   - hometimeline-container runs with GOGC=400 (less garbage collection;
#     see EXTRA_ENV in gen_app_manifest.py)
#   - backends: 5x mongo:7, 5x memcached:1.6 (official images, no push needed)
#   - MongoDB indexes (not in stock Blueprint; the original DeathStarBench has
#     them): each database pod creates its own on first start, from the
#     *-init ConfigMap mounted at /docker-entrypoint-initdb.d:
#       user.user (userid, username), social-graph.social-graph (userid),
#       usertimeline.usertimeline (userid), post.post (postid)
#   - every pod has nodeSelector kubernetes.io/hostname: dell66
#   - ports, env vars and dial addresses copied from docker-compose.yml, with
#     hostnames converted to Kubernetes names (underscores -> hyphens)
#   - wrk2api-container (the HTTP frontend) is a NodePort fixed at 30853,
#     plus a Route; all other Services are ClusterIP
#   - every object has the label app.kubernetes.io/part-of=dsb-sn
#   - TRACING: every service is instrumented with OpenTelemetry (docker_tracing
#     spec) and exports spans to otel-central:4317; the compose file's
#     collector container (otel-collector-ctr) is not deployed. Requires
#     otel-collectors.yaml (otel-local on dell66, otel-central on dell65).
#     SDK settings can be set per Deployment with OTEL_* env vars (see trace.go).
#
# Deploy:   oc apply  -f dsb-sn-tracing-direct.yaml
# Remove:   oc delete -f dsb-sn-tracing-direct.yaml      (rapl keeps running)
# Frontend: http://<dell66-ip>:30853   or   oc get route -n dsb-sn
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compose-container
  namespace: dsb-sn
  labels:
    app: compose-container
    app.kubernetes.io/part-of: dsb-sn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compose-container
  template:
    metadata:
      labels:
        app: compose-container
        app.kubernetes.io/part-of: dsb-sn
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell66
      containers:
      - name: compose-container
        image: docker.io/maxlanliu/dsbsn-compose:tracing
        imagePullPolicy: Always
        ports:
        - containerPort: 12345
        env:
        - name: COMPOSEPOST_SERVICE_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: HOMETIMELINE_SERVICE_GRPC_DIAL_ADDR
          value: hometimeline-container:12345
        - name: MEDIA_SERVICE_GRPC_DIAL_ADDR
          value: media-container:12345
        - name: OTEL_COLLECTOR_DIAL_ADDR
          value: otel-central:4317
        - name: POST_STORAGE_SERVICE_GRPC_DIAL_ADDR
          value: post-storage-container:12345
        - name: TEXT_SERVICE_GRPC_DIAL_ADDR
          value: text-container:12345
        - name: UNIQUEID_SERVICE_GRPC_DIAL_ADDR
          value: uniqueid-container:12345
        - name: USERTIMELINE_SERVICE_GRPC_DIAL_ADDR
          value: usertimeline-container:12345
        - name: USER_SERVICE_GRPC_DIAL_ADDR
          value: user-container:12345
---
apiVersion: v1
kind: Service
metadata:
  name: compose-container
  namespace: dsb-sn
  labels:
    app: compose-container
    app.kubernetes.io/part-of: dsb-sn
spec:
  selector:
    app: compose-container
  ports:
  - name: port-12345
    port: 12345
    targetPort: 12345
---
