metadata:
  name: post-db-ctr-init
  namespace: dsb-sn
  labels:
    app: post-db-ctr
    app.kubernetes.io/part-of: dsb-sn
data:
  create-indexes.js: |
    // Runs once, when this MongoDB pod starts with an empty data directory
    // (every fresh pod here). Created by gen_app_manifest.py.
    const target = db.getSiblingDB('post');
    target.getCollection('post').createIndex({ postid: 1 }, { name: 'postid_1' });
    print('dsb-sn: indexes on post.post: ' + JSON.stringify(target.getCollection('post').getIndexes().map(i => i.key)));
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-db-ctr
  namespace: dsb-sn
  labels:
    app: post-db-ctr
    app.kubernetes.io/part-of: dsb-sn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-db-ctr
  template:
    metadata:
      labels:
        app: post-db-ctr
        app.kubernetes.io/part-of: dsb-sn
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell66
      containers:
      - name: post-db-ctr
        image: docker.io/library/mongo:7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
      - name: init
        configMap:
          name: post-db-ctr-init
---
apiVersion: v1
kind: Service
metadata:
  name: post-db-ctr
  namespace: dsb-sn
  labels:
    app: post-db-ctr
    app.kubernetes.io/part-of: dsb-sn
spec:
  selector:
    app: post-db-ctr
  ports:
  - name: port-27017
    port: 27017
    targetPort: 27017
---
