apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_cgpb_es/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: usermention-service-cgpb-es-ctr
  name: usermention-service-cgpb-es-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: usermention-service-cgpb-es-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_cgpb_es/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: usermention-service-cgpb-es-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: cgpb
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: OTELCOL_CGPB_ES_DIAL_ADDR
          value: otelcol-cgpb-es-ctr:4317
        - name: USERMENTION_SERVICE_CGPB_ES_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: USER_CACHE_CGPB_ES_DIAL_ADDR
          value: user-cache-cgpb-es-ctr:6379
        - name: USER_DB_CGPB_ES_DIAL_ADDR
          value: user-db-cgpb-es-ctr:27017
        image: 10.10.1.1:30000/usermention-service-cgpb-es-ctr:latest
        name: usermention-service-cgpb-es-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
      hostname: usermention-service-cgpb-es-ctr
      restartPolicy: Always
