apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_sb_es_nw/k8s
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: socialgraph-service-sb-es-nw-ctr
  name: socialgraph-service-sb-es-nw-ctr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: socialgraph-service-sb-es-nw-ctr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o /users/tomislav/blueprint-docc-mod/examples/dsb_sn/build_sb_es_nw/k8s
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: socialgraph-service-sb-es-nw-ctr
    spec:
      containers:
      - env:
        - name: BRIDGE_KIND
          value: sb
        - name: GC_INTERVAL_SEC
          value: '0'
        - name: GOGC
          value: '100'
        - name: OTELCOL_SB_ES_NW_DIAL_ADDR
          value: otelcol-sb-es-nw-ctr:4317
        - name: SOCIALGRAPH_SERVICE_SB_ES_NW_GRPC_BIND_ADDR
          value: 0.0.0.0:12345
        - name: SOCIAL_CACHE_SB_ES_NW_DIAL_ADDR
          value: social-cache-sb-es-nw-ctr:6379
        - name: SOCIAL_DB_SB_ES_NW_DIAL_ADDR
          value: social-db-sb-es-nw-ctr:27017
        - name: USERID_SERVICE_SB_ES_NW_GRPC_DIAL_ADDR
          value: userid-service-sb-es-nw-ctr:12345
        image: 10.10.1.1:30000/socialgraph-service-sb-es-nw-ctr:latest
        name: socialgraph-service-sb-es-nw-ctr
        ports:
        - containerPort: 12345
          protocol: TCP
      hostname: socialgraph-service-sb-es-nw-ctr
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: node-4
