# Tomislav-RetCtx: collector ramp with memory protection and larger batches.
# Launch with one CPU, 4 GiB/no swap, GOMAXPROCS=1, and GOMEMLIMIT=2400MiB.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:14317
      http:
        endpoint: 127.0.0.1:14318
processors:
  memory_limiter:
    check_interval: 100ms
    limit_mib: 3072
    spike_limit_mib: 512
  batch:
    send_batch_size: 8192
    send_batch_max_size: 8192
    timeout: 200ms
exporters:
  file:
    path: /dev/null
    format: proto
    flush_interval: 200ms
service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 18888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file]
